name: Hugo Build and Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  # OIDC token for the Tailscale federated identity.
  id-token: write

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.151.2'
          extended: true
      - name: Build Site
        run: hugo --minify
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:deploy-blog
          ping: blog.taile65cb9.ts.net
      # Tailscale SSH authenticates the runner by its tailnet identity, so no SSH key is needed.
      - name: Deploy to Server
        run: >-
          rsync -rlcvz --delete --chmod=D755,F644
          -e "ssh -o StrictHostKeyChecking=accept-new"
          public/ deploy@blog.taile65cb9.ts.net:/srv/www/
